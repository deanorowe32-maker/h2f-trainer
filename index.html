<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Holistic Health and Fitness training for Soldiers: workouts, injury PT, nutrition, sleep and readiness.">
<meta name="theme-color" content="#f3f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1912" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="H2F Trainer">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>H2F Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<style>
/* Performance in forest green and gold, taken from the access code screen. Off-white ground, deep forest green for structure, gold for "now". Wide heavy type, soft 22px cards, pill controls. */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --raised:#e9eee8; --fg:#0e1f16; --muted:#52615a;
  --line:#e0e6df; --line-2:#c9d3cb; --rule:#d5ddd5;
  --ink:#17432f; --ink-fg:#f4f3ec; --ink-muted:#b9cbbf;
  --accent:#17432f; --accent-fg:#f4f3ec; --amber:#e3b23c; --amber-text:#7a5a00;
  --sage:#e3b23c; --sage-ink:#0e1f16; --sage-text:#1d6b45; --fig:#c4ccc0; --fig-zone:#1d6b45; --sage-wash:#e2eee6; --pill:#dcebe1;
  --mark:#c98f12; --warn:#b23c26; --warn-bg:#f8e6e1; --mz:#c2462a; --flame:#e3b23c;
  --gold:#e3b23c; --logo-bg:#0f2e1f; --deep:#0f2e1f; --deep-hi:#1d5038;
  --shadow:0 -6px 30px rgba(14,31,22,.14);
  --card:0 1px 2px rgba(14,31,22,.05),0 8px 26px rgba(14,31,22,.07);
  --scrim:rgba(6,18,12,.45);
  --body:'Archivo',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --mono:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --stencil:'Archivo',ui-sans-serif,system-ui,sans-serif;
  --ease:cubic-bezier(.23,1,.32,1); --ease-drawer:cubic-bezier(.32,.72,0,1); --ease-io:cubic-bezier(.77,0,.175,1); --nav-h:66px; --r:14px; --rc:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1912; --surface:#10241a; --raised:#163022; --fg:#ecf1ec; --muted:#a3b8ab;
  --line:#1b3326; --line-2:#284636; --rule:#21392c;
  --ink:#1d5038; --ink-fg:#f4f3ec; --ink-muted:#b9cbbf;
  --accent:#e3b23c; --accent-fg:#0e1f16; --amber:#e3b23c; --amber-text:#e3b23c;
  --sage:#e3b23c; --sage-ink:#0e1f16; --sage-text:#8fd3ac; --fig:#61806d; --fig-zone:#8fd3ac; --sage-wash:#12291d; --pill:#1a3a29;
  --mark:#e3b23c; --warn:#f08a70; --warn-bg:#3a1f19; --mz:#ff8a66; --flame:#e3b23c;
  --gold:#e3b23c; --logo-bg:#0f2e1f; --deep:#0f2e1f; --deep-hi:#1d5038;
  --shadow:0 -6px 30px rgba(0,0,0,.5); --card:0 0 0 1px #1b3326; --scrim:rgba(2,8,5,.66); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1912; --surface:#10241a; --raised:#163022; --fg:#ecf1ec; --muted:#a3b8ab;
  --line:#1b3326; --line-2:#284636; --rule:#21392c;
  --ink:#1d5038; --ink-fg:#f4f3ec; --ink-muted:#b9cbbf;
  --accent:#e3b23c; --accent-fg:#0e1f16; --amber:#e3b23c; --amber-text:#e3b23c;
  --sage:#e3b23c; --sage-ink:#0e1f16; --sage-text:#8fd3ac; --fig:#61806d; --fig-zone:#8fd3ac; --sage-wash:#12291d; --pill:#1a3a29;
  --mark:#e3b23c; --warn:#f08a70; --warn-bg:#3a1f19; --mz:#ff8a66; --flame:#e3b23c;
  --gold:#e3b23c; --logo-bg:#0f2e1f; --deep:#0f2e1f; --deep-hi:#1d5038;
  --shadow:0 -6px 30px rgba(0,0,0,.5); --card:0 0 0 1px #1b3326; --scrim:rgba(2,8,5,.66); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--line-2) var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--body);margin:0;-webkit-font-smoothing:antialiased;font-feature-settings:'ss01' 0;letter-spacing:-.005em;
  padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 28px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  caret-color:var(--sage-text);font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
body.hasmini{padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 92px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
::selection{background:var(--sage);color:var(--sage-ink)}
main{max-width:640px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sage-text);outline-offset:2px;border-radius:2px}
a{color:var(--fg);text-decoration-color:var(--line-2);text-underline-offset:3px}
p{margin:0 0 8px;max-width:65ch}
h2{font:700 28px/1.12 var(--display);letter-spacing:-.025em;margin:24px 0 8px;text-wrap:balance}
h3{font:600 18px/1.3 var(--display);letter-spacing:-.01em;margin:0 0 8px;color:var(--fg);text-wrap:balance}
small{font-size:14px}

/* ---- Shell: compact top bar, bottom tab bar ---- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--ink);color:var(--ink-fg);padding-block:8px;
  margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-bottom:1px solid rgba(0,0,0,.25)}
.topin{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:44px}
.appicon{display:block;border-radius:22%;flex:none;object-fit:cover}
header.top .appicon{width:32px;height:32px}
.brand{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.mark{font:650 18px/1.15 var(--display);letter-spacing:-.01em;color:inherit;white-space:nowrap}
.sub{font:500 12px/1.3 var(--body);color:var(--ink-muted)}
#saveStat{font:500 12px var(--body);color:var(--ink-muted);text-align:right;max-width:38%;line-height:1.25}
#saveStat:empty{display:none}
.menubtn{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--r);background:transparent;color:var(--ink-fg)}
.menubtn:active{background:rgba(255,255,255,.14)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  background:var(--surface);border-top:1px solid var(--line-2);
  padding:0 max(4px,env(safe-area-inset-right,0px),calc((100vw - 640px)/2)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px),calc((100vw - 640px)/2))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:var(--nav-h);
  border:0;background:none;color:var(--muted);font:600 12px/1.15 var(--body);letter-spacing:.01em;padding:8px 2px 8px;min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .ico{width:22px;height:22px;flex:none}
.tab::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;border-radius:0 0 2px 2px;background:var(--rule);transform:scaleX(0)}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"]::before{transform:scaleX(1)}
.tab:active .ico{transform:scale(.9)}
.tab .ico{transition:transform .16s var(--ease)}

/* Menu and More sheets */
.menulist{display:flex;flex-direction:column;margin:4px 0 8px}
.menulist button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:16px;min-height:52px;padding:8px 4px;border-bottom:1px solid var(--line);font:600 16px var(--body);color:var(--fg)}
.menulist button:first-child{border-top:2px solid var(--rule)}
.menulist button:focus-visible{outline:2px solid var(--sage-text);outline-offset:-2px}
.menulist button:active{background:var(--surface)}
.menulist .ico{width:22px;height:22px;color:var(--muted);flex:none}
.menulist button[aria-current="page"]{color:var(--fg)}
.menulist button[aria-current="page"] .ico{color:var(--sage-text)}
.menulist button[aria-current="page"]::after{content:"Open";margin-left:auto;font:600 12px var(--body);color:var(--sage-text)}
.hdrnav{display:none}

/* ---- Headings and text helpers ---- */
.tag{font:500 14px/1.4 var(--body);color:var(--muted);letter-spacing:0;text-transform:none}
.note{background:var(--surface);border:1px solid var(--line);padding:8px 12px;border-radius:var(--r);font-size:14px;color:var(--muted);margin:8px 0}
.note b{color:var(--fg)}
.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.res{font:600 16px/1.45 var(--body);margin:8px 0}
main a{color:var(--fg)}
.lnk{all:unset;cursor:pointer;color:var(--sage-text);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.lnk:focus-visible{outline:2px solid var(--sage-text)}
footer{margin-top:32px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* ---- Buttons and controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);
  border-radius:var(--r);padding:8px 16px;font:700 16px/1.2 var(--body);letter-spacing:.01em;min-height:46px;text-decoration:none;
  transition:transform .1s ease-out,background-color .15s,border-color .15s,color .15s}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-2)}
.btn.small{padding:4px 12px;min-height:44px;font-size:14px}
.iconbtn{display:inline-grid;place-items:center;border:1px solid var(--line-2);background:transparent;border-radius:var(--r);min-width:44px;min-height:44px;color:var(--fg);font:600 18px var(--body)}
.iconbtn:active{background:var(--surface)}
.x{display:inline-grid;place-items:center;border:0;background:none;color:var(--muted);min-width:44px;min-height:44px;border-radius:var(--r)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:var(--r);padding:8px 12px;font:600 14px var(--body);min-height:40px;color:var(--fg);transition:background-color .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px;margin:12px 0}
.form label{display:flex;flex-direction:column;gap:4px;font:600 14px/1.3 var(--body);color:var(--muted);min-width:0}
.form .wide{grid-column:1/-1}
select,input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],#sl_h,.nin,textarea{
  background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 12px;font:400 16px var(--body);color:var(--fg);
  min-height:46px;width:100%;min-width:0;max-width:100%;box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--sage-text);box-shadow:0 0 0 3px color-mix(in srgb,var(--sage) 35%,transparent)}
::placeholder{color:var(--muted);opacity:.85}
textarea{min-height:110px;font:400 16px/1.5 var(--body);resize:vertical;margin-top:4px}
input[type=range]{width:100%;accent-color:var(--sage-text)}
input[type=checkbox],input[type=radio]{accent-color:var(--sage-text)}
.checks label{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;min-height:44px}
.checks input{width:24px;height:24px;margin-top:0;flex:none}

/* ---- The schedule: week bar and day columns (signature) ---- */
.weekbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 0;gap:8px;padding-bottom:8px}
.weekbar .rng{font:700 16px var(--display);letter-spacing:.01em}
.strip,.sched{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2);border-bottom:2px solid var(--rule);margin:0 0 4px}
.dcell,.sched .sc{position:relative;isolation:isolate;border:0;border-left:1px solid var(--line);background:transparent;color:var(--fg);border-radius:0;
  padding:8px 8px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px;min-width:0}
.dcell:first-child,.sched .sc:first-child{border-left:0}
.dcell::before,.sched .sc::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);clip-path:inset(0 0 100% 0)}
.dcell .dw,.sched .dw{font:600 12px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.dcell .dn,.sched .dn{font:700 24px/1 var(--display)}
.dcell .dt,.sched .dt{margin-top:auto;font:600 12px/1.2 var(--body);color:var(--fg);overflow-wrap:anywhere;hyphens:auto}
.dcell[aria-pressed="true"],.sched .sc.now{color:var(--ink-fg)}
.dcell[aria-pressed="true"]::before,.sched .sc.now::before{clip-path:inset(0 0 0 0)}
.dcell[aria-pressed="true"] .dw,.sched .sc.now .dw{color:var(--ink-muted)}
.dcell[aria-pressed="true"] .dt,.sched .sc.now .dt{color:var(--ink-fg)}
.dcell.today::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:3px;background:var(--sage)}
.sched .sc{text-decoration:none;cursor:pointer;font:inherit}
.sched .tick{width:16px;height:16px;color:var(--sage-text);margin-top:2px}
.sched .sc.now .tick{color:var(--sage)}
.sched .sc.off .dt{color:var(--muted);font-weight:500}
.schedmeta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:16px 0 8px}
.schedmeta h3{margin:0}

/* ---- Rows: exercises, list items ---- */
.sec{margin-top:20px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:2px solid var(--rule);margin-bottom:0}
.sechead h3{margin:0}
.item{display:flex;flex-wrap:wrap;gap:8px 8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-radius:0;margin:0}
.item .nm{flex:1 1 150px;min-width:0;text-align:left;background:none;border:0;padding:0;font:650 16px/1.3 var(--body);color:var(--fg);overflow-wrap:anywhere}
.item .nm small{display:block;font:500 14px/1.35 var(--body);color:var(--muted);margin-top:2px}
.editday{margin:12px 0 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:0 16px}
.editday>summary{min-height:48px;display:flex;align-items:center;font:600 16px var(--body);cursor:pointer;list-style:none}
.editday>summary::-webkit-details-marker{display:none}
.editday>summary::after{content:'';margin-left:auto;width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.editday[open]>summary::after{transform:rotate(-135deg)}
.editday[open]{padding-bottom:12px}
.gted label,.gtlogf label{display:flex;flex-direction:column;gap:4px;margin:8px 0;font:600 14px var(--body)}
.gted input,.gted select,.gted textarea,.gtlogf input{font:500 16px var(--body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.gted [aria-invalid=true],.gtlogf [aria-invalid=true]{border-color:var(--warn);box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 30%,transparent)}
.gtev{border:1px solid var(--line);border-radius:var(--r);padding:8px 12px 12px;margin:12px 0}.gtev legend{font:700 14px var(--body);padding:0 4px}
.gtrow{display:flex;gap:12px}.gtrow>label{flex:1}.gterr{color:var(--warn);font-weight:600}
.gtsum{margin:12px 0;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.gthead{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}.gthead small{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.gthead b{font:700 20px var(--body)}.gthead span{color:var(--muted);font-size:14px}
.gtsum table{width:100%;border-collapse:collapse;font-size:14px}.gtsum th,.gtsum td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-variant-numeric:tabular-nums}
.gtsum th:first-child,.gtsum tbody th{text-align:left}.gtsum thead th{font:700 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gtsum tbody th{font-weight:600}.gtsum tbody th small{display:block;font-weight:500;color:var(--muted)}.gtsum td.hit{color:var(--sage-text);font-weight:700}
.chcard{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.chsum{margin:2px 0 0;font:500 14px var(--body);color:var(--muted)}
.sgrow{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r)}.sgtop{display:flex;gap:8px;align-items:center}.sgtop input{flex:1}
.sggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}.sggrid .nin{width:100%;min-width:0;box-sizing:border-box}.sgres{margin:8px 0 0;font:500 14px var(--body)}
.sgpast{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.sgpast span:first-child{display:flex;flex-direction:column}.sgpast .btn{min-height:40px;padding:0 12px;margin-left:4px}
#sgPrint{display:none}
@media print{body.sgp>*:not(#sgPrint){display:none!important}body.sgp>#sgPrint{display:block!important;color:#000;background:#fff;font:12px/1.4 sans-serif}#sgPrint table{width:100%;border-collapse:collapse}#sgPrint th,#sgPrint td{border:1px solid #000;padding:4px;text-align:left;vertical-align:top}}
.aftneed{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.aftneed h4{margin:0 0 6px;font:700 16px var(--body)}
.coach{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}.coach h3{margin:0 0 4px}.coachtip{padding:10px 0;border-top:1px solid var(--line)}.coachtip:first-of-type{border-top:0}.coachtip b{display:block;font:700 16px var(--body)}.coachtip p{margin:2px 0 8px}.coachtip .btn{min-height:40px}.coachnote{margin:4px 0 0}
.heatflag.hf1[aria-pressed=true]{background:#fff;color:#13261c;border-color:#13261c}.heatflag.hf2[aria-pressed=true]{background:#2f7d3a;color:#fff}.heatflag.hf3[aria-pressed=true]{background:#e8c22a;color:#13261c}.heatflag.hf4[aria-pressed=true]{background:#b3261e;color:#fff}.heatflag.hf5[aria-pressed=true]{background:#111;color:#fff}
.lsbox{margin:12px 0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r)}.lsbox h3{margin:0 0 6px}.lscode{font:700 20px var(--mono);letter-spacing:.08em}.lslive{display:inline-block;padding:0 6px;border-radius:6px;background:var(--gold);color:#13261c;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.04em}
.tdbk{margin:14px 0 4px;padding:12px 14px;border:1px solid var(--gold);border-radius:var(--r);background:var(--surface)}.tdbk h3{margin:0 0 4px}
.chhead{display:flex;align-items:center;justify-content:space-between}.chhead h3{margin:0}.chfold{min-height:44px;padding:0 6px;border:0;background:none;color:var(--muted);font:600 14px var(--body)}
.chrow{padding:12px 0;border-top:1px solid var(--line)}.chtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.chtop span{display:flex;flex-direction:column;gap:2px;min-width:0}

.chlink{padding:0;border:0;background:none;text-align:left;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
.chlog{flex:none;min-height:40px;padding:0 14px}.chnum{display:block;margin-top:6px;font:500 14px var(--body);color:var(--muted)}.chok{color:var(--fg)}
.chbar{position:relative;display:block;height:8px;margin-top:6px;border-radius:4px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}.chbar>i{display:block;height:100%;background:var(--gold)}
.chbar em{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--surface)}
.chmd{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chlv{gap:6px;flex-wrap:wrap}.chlv .btn{flex:1 1 auto}.chtrib{margin:6px 0 0}
.gtbar{display:block;height:6px;margin-top:6px;border-radius:3px;background:color-mix(in srgb,var(--fg) 10%,transparent);overflow:hidden}.gtbar i{display:block;height:100%;background:var(--gold)}
.gtwhy{margin:12px 0 0}.gtappr{margin:8px 0 0;font-weight:600}.gtmet{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 20%,transparent)}
.gtact{flex-wrap:wrap}.gtcopy{width:100%;font:500 14px/1.4 var(--body);padding:10px;border:1px solid var(--line);border-radius:10px}
.gtpast{margin-top:12px}.gtpast summary{min-height:44px;display:flex;align-items:center;font-weight:600;cursor:pointer}.gtpast ul{list-style:none;margin:0;padding:0}.gtpast li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cftclock{margin:12px 0;padding:16px;border-radius:var(--r);background:var(--ink);color:var(--ink-fg);text-align:center}
#cftClock{font:800 48px/1 var(--display,var(--body));font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#cftLeft{margin-top:6px;font:600 14px var(--body);opacity:.85}
#cftLeft.over{color:var(--gold);opacity:1}
.rbnext{display:flex;align-items:center;gap:14px;width:100%;margin:12px 0 4px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;font:500 14px var(--body);color:var(--muted);cursor:pointer}
.rbnext svg{flex:none;width:64px;height:auto}.rbnext span{display:flex;flex-direction:column;gap:2px}.rbnext small{font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase}.rbnext b{font:700 16px var(--body);color:var(--fg)}
.focus{margin:12px 0;padding:14px 16px;border-radius:var(--r);border:1px solid color-mix(in srgb,var(--gold) 55%,var(--line));background:color-mix(in srgb,var(--gold) 10%,var(--surface))}
.focus p{margin:4px 0 0}.focus .row{margin-top:12px}
.ready{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:inherit}
.ready p{margin:0 0 8px}.ready.on{background:color-mix(in srgb,#fff 12%,transparent)}
.privacy{margin:20px 0 8px;font:500 14px var(--body);color:var(--muted);text-align:center}
.cftbtns{margin:0 0 8px}
.cftbtns .cftnext{flex:1 1 100%;min-height:64px;font-size:18px}
.cftlist{list-style:none;margin:0;padding:0;counter-reset:cft}
.cftev{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);counter-increment:cft}
.cftev>span:first-child{display:flex;flex-direction:column}
.cftev>span:first-child b::before{content:counter(cft) ". ";color:var(--muted)}
.cftev small{font:500 14px var(--body);color:var(--muted)}
.cftev.now{background:color-mix(in srgb,var(--gold) 14%,transparent);margin:0 -8px;padding:12px 8px;border-radius:8px}
.cftev.done b{color:var(--muted)}
.cftsp{text-align:right;font:700 16px var(--body);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end}
.cftsp .up{color:var(--sage-text)}.cftsp .dn{color:var(--warn)}
.cfthist{list-style:none;margin:0;padding:0}.cfthist li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tdsec{font:700 12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:12px 0 2px}
.nm .code{display:inline-block;min-width:28px;margin-right:4px;font:700 12px var(--body);color:var(--muted);letter-spacing:.02em}
.item.hasw .nm{flex:1 1 100%}
.wtbox{display:flex;align-items:center;gap:4px;font:500 14px var(--body);color:var(--muted)}
.rx,.wtbox input{background:var(--raised);border:1px solid var(--line-2);border-radius:var(--r);padding:8px 8px;font:600 14px var(--body);min-height:40px;color:var(--fg);font-variant-numeric:tabular-nums}
.rx{width:150px;max-width:100%}
.item.hasw{column-gap:8px}
.item.hasw .rx{width:96px}
.item .wtbox:not(.pctbox) input{width:66px}
.item .pctbox input{width:76px}
.lastw{flex:1 1 100%;font:500 14px var(--body);color:var(--muted);margin-top:4px}
.lastw b{color:var(--fg);font-weight:600}
.lastw .linkbtn{margin-left:4px;padding:2px 8px;border:0;background:none;color:var(--accent,var(--fg));font:600 14px var(--body);text-decoration:underline;cursor:pointer}
.pcthint{flex:1 1 100%;font:500 14px var(--body);color:var(--muted);margin-top:2px}
.pcthint b{color:var(--fg)}
.list .item{cursor:default}
.inj{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;min-width:0}
.inj .form{margin:8px 0 0}
.injh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.injh h3{margin:0}

/* Struck rows: marker strike through a finished exercise (focal motion) */
.sn{position:relative;display:inline}
.struck .sn{color:var(--muted)}
.struck .sn::after{content:"";position:absolute;left:-3px;right:-3px;top:54%;height:2px;border-radius:2px;background:var(--mark);transform-origin:left center}
.fresh .sn::after{animation:strike .26s var(--ease) both}
@keyframes strike{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.tk{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:8px;color:var(--sage-text)}

/* ---- Today ---- */
.tdbig{font:700 28px/1.05 var(--display);margin:2px 0 4px;font-variant-numeric:tabular-nums}
.tdbig small{font:500 14px var(--body);color:var(--muted)}
.tdcard{display:flex;flex-direction:column;min-width:0;padding:12px 0 16px;border-top:2px solid var(--rule);background:none;border-radius:0}
.tdcard h3{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:16px;color:var(--muted)}
.tdcard h3 .ico{width:17px;height:17px}
.tdcard p{margin:0 0 8px}
.tdwide{margin-top:24px}
.tdwide .sechead h3{display:flex;align-items:center;gap:8px}
.tdwide .sechead .ico{width:18px;height:18px;color:var(--muted)}
.tdwide .tdbig{font-size:28px;margin-top:12px}
.tdwide>p{margin-bottom:8px}
.tdwide .row{margin:8px 0 0}
.tdgrid{display:block;margin-top:24px;border-top:2px solid var(--rule)}
.tdgrid .tdcard{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"h v" "t b";column-gap:12px;row-gap:2px;align-items:center;padding:12px 0;border-top:0;border-bottom:1px solid var(--line)}
.tdgrid .tdcard h3{grid-area:h;margin:0;font-size:16px;color:var(--fg)}
.tdgrid .tdcard h3 .ico{color:var(--muted)}
.tdgrid .tdcard .tdbig{grid-area:v;justify-self:end;font-size:20px;margin:0;letter-spacing:-.02em}
.tdgrid .tdcard .tdbig small{font-size:14px}
.tdgrid .tdcard p{grid-area:t;margin:0}
.tdgrid .tdbtn{grid-area:b;justify-self:end;align-self:start}
.tdbtn{padding:8px 12px;font-size:14px;min-height:40px}
.tdrows{margin:4px 0 8px}
.tdrows .item{padding:8px 0}
.tdrows .rxv{flex:none;font:650 14px var(--body);color:var(--fg);text-align:right}
.tdstreak{margin-top:8px}
.tddots{display:none}
.tddone{display:inline-flex;align-items:center;gap:8px;font:700 16px var(--body);color:var(--sage-text);align-self:center}
.tddone .tk{margin:0}

/* ---- Panels and bottom sheets ---- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;opacity:1;transition:opacity .2s ease-out,display .2s allow-discrete}
.sheet[hidden]{display:none!important;opacity:0;transition-duration:.16s,.2s}
.sheet>.panel{transform:translateY(0);transition:transform .42s var(--ease-drawer)}
.sheet[hidden]>.panel{transform:translateY(100%);transition:transform .2s var(--ease)}
@starting-style{.sheet:not([hidden]){opacity:0}.sheet:not([hidden])>.panel{transform:translateY(100%)}}
.grab{position:absolute;top:0;left:0;right:0;height:26px;touch-action:none;cursor:grab;z-index:2}
.grab::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line-2)}
.grab:active{cursor:grabbing}
.panel{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:90%;overflow-y:auto;overscroll-behavior:contain;
  border-radius:12px 12px 0 0;border:1px solid var(--line-2);border-bottom:0;box-shadow:var(--shadow);
  padding:22px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2{margin-top:2px}
.evcard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px;margin:8px 0}
.evhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:18px}
.evm{display:flex;flex-direction:column;gap:4px;font:600 14px var(--body);color:var(--muted);margin-top:8px}
.plan{border:1px solid var(--line);border-top:2px solid var(--rule);border-radius:0;padding:12px;margin:12px 0;background:var(--surface)}
.plan ul{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
ol.steps{margin:8px 0 8px;padding-left:24px}
ol.steps li{margin-bottom:8px;max-width:60ch}
ol.steps li::marker{font-weight:700;color:var(--muted)}
.cue{border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:8px 0;margin:12px 0;font-size:16px;font-style:italic}
.cards{display:grid;gap:0;margin-top:8px;border-top:2px solid var(--rule)}
.cmx{border-bottom:1px solid var(--line);margin:0;padding:0 2px}
.cmx:first-of-type{border-top:2px solid var(--rule)}
.cmx summary{cursor:pointer;min-height:52px;display:flex;flex-direction:column;justify-content:center;padding:8px 0;list-style:none}
.cmx summary::-webkit-details-marker{display:none}
.cmx summary small{font:500 14px var(--body);color:var(--muted)}
.cmx[open] summary{border-bottom:1px solid var(--line)}
.cmx>*:last-child{margin-bottom:12px}
.dom{display:flex;flex-direction:column;gap:2px;border:0;border-bottom:1px solid var(--line);background:none;border-radius:0;padding:12px 2px;width:100%;text-align:left;min-height:64px;color:var(--fg)}
.dom:active{background:var(--surface)}
.dom b{font:700 20px var(--display)}
.dom span{color:var(--muted);font-size:14px}
.tips{margin:8px 0 0;padding-left:20px}
.tips li{margin-bottom:8px;max-width:60ch}
.tips li::marker{color:var(--muted)}

/* ---- Tables, stats, numbers ---- */
.ptable{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;font-variant-numeric:tabular-nums}
.ptable th{font:700 12px var(--body);color:var(--muted);text-align:left;padding:8px 4px;border-bottom:2px solid var(--rule)}
.ptable td{padding:8px 4px;border-bottom:1px solid var(--line)}
.ptable td .x{min-height:44px;min-width:44px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:8px 0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line)}
.stats div{padding:8px 8px 8px 0;border-left:1px solid var(--line);padding-left:8px}
.stats div:first-child{border-left:0;padding-left:0}
.stats b{display:block;font:700 28px/1.1 var(--display)}
.stats span{font:500 14px var(--body);color:var(--muted)}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:8px 0;border-top:2px solid var(--rule);border-bottom:1px solid var(--line)}
.times div{padding:8px 4px;text-align:center;font:700 24px var(--display);border-left:1px solid var(--line)}
.times div:first-child{border-left:0}
.times small{display:block;font:500 12px var(--body);color:var(--muted)}
.counter{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.counter .big{font:700 48px/1 var(--display);min-width:2.2ch;text-align:center}
.cups{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.cup{width:22px;height:28px;border:2px solid var(--sage-text);border-radius:2px 2px 7px 7px;display:block;transition:background-color .2s}
.cup.on{background:var(--sage-text)}
.plate{display:flex;height:24px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;margin:8px 0 8px}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:8px;vertical-align:-1px}
.stclock{font:700 72px/1 var(--display);text-align:center;margin:8px 0}
.stbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 12px}
.stbar i{display:block;height:100%;background:var(--sage-text);transition:width .3s linear}
.tmbig{font:700 78px/1 var(--display);text-align:center;letter-spacing:-.01em;margin:8px 0 4px}
.restbig{font:700 28px var(--display)}
.cur{border:0;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule);border-radius:0;padding:12px 0;margin:12px 0;background:none}
.curn{font:700 28px/1.1 var(--display);overflow-wrap:anywhere;margin:2px 0}
.rxl{font:600 16px var(--body);color:var(--muted)}

/* Breathing */
.breath{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0 8px}
.orb{width:150px;height:150px;max-width:100%;border-radius:50%;border:3px solid var(--sage-text);background:var(--surface);transform:scale(.6);transition:transform .6s linear}
.bt{font:700 24px var(--display);min-height:30px}

/* Month view */
.mgrid{display:flex;flex-direction:column;gap:0;margin-top:8px;border-top:2px solid var(--rule)}
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,1fr));gap:4px;align-items:center}
.mhead{padding:8px 8px;border-bottom:1px solid var(--line)}
.mhead span{font:700 12px var(--body);color:var(--muted);text-align:center;letter-spacing:.04em;text-transform:uppercase}
.mrow{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(5,minmax(0,1fr));gap:4px;align-items:center;cursor:pointer;padding:8px 8px;border-bottom:1px solid var(--line);min-height:52px}
.mrow.cur{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.mrow.cur .mrng small,.mrow.cur .mcell i,.mrow.cur .mcell.empty{color:var(--ink-muted)}
.mrow:focus-visible{outline:2px solid var(--sage-text);outline-offset:-2px}
.mrng{font:700 14px/1.2 var(--body);padding-left:2px}
.mrng small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mcell{font:650 12px/1.15 var(--body);text-align:center;overflow-wrap:anywhere}
.mcell.empty{color:var(--muted)}
.mcell i{display:block;font-style:normal;font-size:12px;color:var(--muted)}

/* Food list */
.fdlist{margin-top:8px}
.fdrow{display:flex;flex-wrap:nowrap;align-items:center;gap:8px}
.fdrow .nm{flex:1 1 auto;min-width:0}
.fdrow .btn{flex:none;min-width:84px}

/* ---- Exercise illustrations ---- */
.ill{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 8px}
.ill figure{margin:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:4px 4px 8px;min-width:0}
.ill figcaption{font:600 12px var(--body);color:var(--muted);text-align:center;margin-top:4px}
.ill img{display:block;width:100%;aspect-ratio:120/114;object-fit:cover;border-radius:2px;max-width:100%}
.ill img.bp{aspect-ratio:3/2;object-fit:contain;background:#fff}
.ytcard{position:relative;display:block;margin:12px 0 8px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000;text-decoration:none;aspect-ratio:16/9}
.ytcard img{display:block;width:100%;height:100%;object-fit:cover;opacity:.92}
.ytplay{position:absolute;left:50%;top:50%;width:64px;height:44px;margin:-24px 0 0 -32px;border-radius:12px;background:#e00}
.ytplay::after{content:'';position:absolute;left:26px;top:13px;border-style:solid;border-width:9px 0 9px 15px;border-color:transparent transparent transparent #fff}
.ytlab{position:absolute;left:0;right:0;bottom:0;padding:8px 8px;font:600 14px var(--body);color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.ill .noimg{aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line-2);border-radius:2px;font:600 12px var(--body);color:var(--muted);text-align:center;padding:8px}
.mzcap{display:flex;align-items:center;gap:8px}
.mzdot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--mz);opacity:.6}
.ph{display:none}
.phb{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:8px}
.phb .btn{padding:4px 8px;min-height:36px;font-size:14px;position:relative;overflow:hidden}
.vh{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0}
.pday{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.pdays{display:grid;gap:0;margin:8px 0;border-top:2px solid var(--rule)}
.pday span{font:700 14px var(--body);letter-spacing:.06em;width:44px;text-transform:uppercase;color:var(--muted)}

/* ---- Workout timer mini bar (sits above the tab bar) ---- */
#mini{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:39;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;gap:8px;
  padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-top:1px solid rgba(0,0,0,.3)}
#mini[hidden]{display:none!important}
#mini b{font:700 28px var(--display);margin-right:auto}
#mini .tag{color:var(--ink-muted)}
#mini .btn{background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg)}
#mini .btn.ghost{background:transparent;color:var(--ink-fg);border-color:rgba(236,229,204,.4)}

/* ---- Access code gate ---- */
#gate{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--ink-fg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
#gate[hidden]{display:none!important}
#gate .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#gate .appicon.big{width:96px;height:96px;margin:0 0 8px}
#gate .mark{font-size:40px;white-space:normal}
#gate .sub{color:var(--ink-muted);font-size:16px}
#gate .err{color:#f1a585;font-size:14px;min-height:20px}
#gate input{font:700 20px var(--body);letter-spacing:.14em;text-align:center;text-transform:uppercase;background:rgba(0,0,0,.18);border-color:rgba(236,229,204,.35);color:var(--ink-fg)}
#gate .btn{background:var(--ink-fg);color:var(--ink);border-color:var(--ink-fg)}

/* ---- Print sheet (paper, fixed colours on purpose) ---- */
#prSheet{position:fixed;inset:0;z-index:90;background:#fff;color:#111;overflow:auto;-webkit-overflow-scrolling:touch;font-family:var(--body)}
#prSheet[hidden]{display:none!important}
#prSheet .prbar{position:sticky;top:0;background:#f1f1ec;border-bottom:1px solid #bbb;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#prSheet .prbar .btn{background:#2b3520;color:#ece5cc;border-color:#2b3520}
#prSheet .prbar .btn.ghost{background:transparent;color:#111;border-color:#999}
#prSheet .prbar label{font-size:16px;display:flex;gap:8px;align-items:center;min-height:44px}
#prDoc{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:780px;margin:0 auto;font-size:14px;line-height:1.4}

.tdwide{background:radial-gradient(120% 90% at 50% 0%,var(--deep-hi) 0%,var(--deep) 72%);color:#f4f3ec;border:0;border-radius:var(--rc);box-shadow:0 12px 32px rgba(15,46,31,.22);

/* Bottom navigation: five tabs, a gold pill slides to the current one */
nav#tabs.tabs{display:block;grid-template-columns:none;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--surface) 92%,transparent);border-top:1px solid var(--line)}

.tabs .tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:54px;padding:4px 0 2px;border:0;background:none;color:var(--muted);font:600 12px/1.1 var(--body);font-stretch:100%}

.start{padding:16px 16px 8px;margin:16px 0}

<script>
const CATS={warmup:'Warm-up',power:'Power',barbell:'Barbell',dumbbell:'Dumbbell',kettlebell:'Kettlebell',landmine:'Landmine',plyo:'Plyometric',unilateral:'Unilateral',bodyweight:'Bodyweight',band:'Band',cooldown:'Cool-down',roll:'Foam rolling',conditioning:'Conditioning',pt:'PT'};
const RXC={warmup:'1×10',power:'4×4',barbell:'4×6',dumbbell:'3×10',kettlebell:'4×10',landmine:'3×8',plyo:'3×5',unilateral:'3×8/side',bodyweight:'3×10',band:'3×15',cooldown:'2×30–45 s',conditioning:'20 min',pt:'2×10',roll:'60 s each side'};
// id|name|cat|section(W warm-up, M main, C cool-down)|equipment|steps;..|cue
const RAW=`inch|Inchworm|warmup|W|None|Stand tall, hinge forward, and walk your hands out to a high plank.;Hold one beat with hips low and core braced.;Walk your feet toward your hands, stand up, and repeat.|Keep knees as straight as comfortable.
wgs|World's Greatest Stretch|warmup|W|None|Step into a deep lunge with both hands inside the front foot.;Drop the back-side elbow toward the floor, then rotate your chest open.;Return to the lunge, switch legs, and repeat.|Move slowly and exhale during the twist.
legsw|Leg Swings|warmup|W|Wall or rack|Hold a wall or rack for balance and stand tall.;Swing one leg forward and back with control, 10 reps.;Face the wall and swing side to side, then switch legs.|Stay tall. Do not force range.
brdg|Glute Bridge|warmup|W|None|Lie on your back, knees bent, feet flat.;Press through your heels and lift hips until knees, hips and shoulders line up.;Squeeze your glutes at the top, then lower slowly.|Ribs down. Do not arch the low back.
catcow|Cat-Cow|warmup|W|None|Start on hands and knees, hands under shoulders, knees under hips.;Round your spine and tuck your chin.;Arch your back and lift your chest, breathing with each rep.|Make the movement smooth, not fast.
armc|Arm Circles and Scap Push-Ups|warmup|W|None|Make 10 small, then 10 large arm circles.;In a plank, let your chest sink between your shoulder blades.;Push the floor away to spread the shoulder blades apart.|Elbows stay straight during scap push-ups.
bws|Bodyweight Squat|warmup|W|None|Stand with feet shoulder-width, toes slightly out.;Sit hips back and down, chest up.;Drive through the whole foot to stand.|Knees track over toes.
kbhalo|Kettlebell Halo|warmup|W|Kettlebell|Hold the kettlebell upside down by the horns at chest height.;Circle it slowly around your head, close to your body.;Reverse direction after 5 reps.|Ribs stay down. Do not lean back.
bsd|Band Shoulder Dislocates|band|W|Resistance band|Hold a band wide in front of your thighs, arms straight.;Raise it overhead and behind you in one smooth arc.;Return the same way. Narrow your grip only if needed.|Wide grip. Never force the arc.
hpc|Hang Power Clean|power|M|Barbell|Hold the bar at mid-thigh, hips hinged, lats tight.;Drive hips forward, shrug, and pull elbows high.;Catch the bar on your shoulders in a quarter squat, then stand.|Jump first, pull second.
ppress|Push Press|power|M|Barbell|Rack the bar on your shoulders with a tall chest.;Dip a quarter squat, then drive your legs hard.;Press overhead to lockout, then lower to the rack.|Legs start the press, arms finish it.
mslam|Medicine Ball Slam|power|M|Medicine ball|Raise the ball overhead and rise onto your toes.;Slam it down just ahead of your feet, hinging at the hips.;Catch the bounce and reset.|Throw your whole body into it.
mrot|Medicine Ball Rotational Throw|power|M|Medicine ball, wall|Stand side-on to a wall with the ball at your hip.;Rotate hips first, then torso, and throw to the wall.;Catch it, reset, and switch sides.|Power comes from the hips.
bsq|Back Squat|barbell|M|Barbell, rack|Bar on your upper back, feet shoulder-width, brace your core.;Sit down and back until thighs are at least parallel.;Drive up through mid-foot, keeping your chest tall.|Big breath, brace, then descend.
rdl|Romanian Deadlift|barbell|M|Barbell|Stand holding the bar at your thighs, soft knees.;Push hips back, bar slides down your legs, back flat.;Stop at mid-shin or when hamstrings stretch, then drive hips forward.|Hips go back, not down.
dl|Deadlift|barbell|M|Barbell|Feet hip-width, bar over mid-foot, grip just outside the legs.;Brace, pull slack out of the bar, and push the floor away.;Stand tall with glutes tight, then lower with control.|Bar stays against your legs.
bench|Bench Press|barbell|M|Barbell, bench|Lie with eyes under the bar, shoulder blades pinched, feet planted.;Unrack and lower the bar to your mid-chest.;Press to lockout over your shoulders.|Keep wrists stacked over elbows.
bor|Bent-Over Row|barbell|M|Barbell|Hinge at the hips with a flat back, bar hanging at knees.;Row the bar to your lower ribs, elbows close.;Lower under control without standing up.|Pull with your elbows, not your hands.
ohp|Overhead Press|barbell|M|Barbell|Bar at collarbone, glutes and core tight.;Press straight up, moving your head through at the top.;Lock out ears-through-arms, then lower to the collarbone.|No leaning back.
hthr|Hip Thrust|barbell|M|Barbell, bench|Upper back on a bench, bar over your hips with a pad.;Drive through your heels until your hips are fully extended.;Pause with a squeeze, then lower slowly.|Chin tucked, ribs down.
dbp|Dumbbell Bench Press|dumbbell|M|Dumbbells, bench|Lie back with dumbbells over your chest.;Lower until elbows reach about 45 degrees from your torso.;Press back up in a slight arc.|Control the descent.
gsq|Goblet Squat|dumbbell|M|Dumbbell|Hold one dumbbell vertically against your chest.;Squat down between your knees, elbows inside them.;Stand tall without letting the weight pull you forward.|Chest up the whole time.
dbsp|Dumbbell Shoulder Press|dumbbell|M|Dumbbells|Hold dumbbells at shoulder height, palms forward.;Press overhead until your arms are straight.;Lower to your shoulders with control.|Ribs down, glutes tight.
dbrdl|Dumbbell Romanian Deadlift|dumbbell|M|Dumbbells|Hold dumbbells at your thighs, knees soft.;Push hips back and slide the weights down your legs.;Drive hips forward to stand.|Back stays flat.
latr|Lateral Raise|dumbbell|M|Dumbbells|Stand with light dumbbells at your sides.;Raise arms out to shoulder height with a slight elbow bend.;Lower slowly.|Lead with the elbows.
dbfc|Farmer Carry|dumbbell|M|Dumbbells|Pick up a heavy dumbbell in each hand.;Stand tall with shoulders back.;Walk with short, quick steps for 30–40 m.|Do not let the weights swing.
kbs|Kettlebell Swing|kettlebell|M|Kettlebell|Hike the kettlebell back between your legs, flat back.;Snap your hips forward so the bell floats to chest height.;Let it fall and hinge back into the next rep.|Hips do the work, arms just guide.
tgu|Turkish Get-Up|kettlebell|M|Kettlebell|Lie on your back, press the kettlebell straight up.;Roll to your elbow, then hand, lift hips, and sweep a leg back to kneel.;Stand up, then reverse every step to the floor.|Eyes on the bell throughout.
kbcp|Kettlebell Clean and Press|kettlebell|M|Kettlebell|Swing the bell back, then pull it to the rack at your shoulder.;Brace and press it overhead.;Lower to the rack, then back to the swing path.|Keep the bell close to your body.
boxj|Box Jump|plyo|M|Plyo box|Stand an arm's length from a box, feet shoulder-width.;Swing arms and jump, landing softly on top with bent knees.;Stand tall, then step down.|Land quietly. Step down, do not jump down.
brdj|Broad Jump|plyo|M|None|Stand with feet hip-width and swing your arms back.;Jump forward as far as you can.;Stick the landing in a quarter squat, then reset.|Stick every landing.
jsq|Jump Squat|plyo|M|None|Squat to a comfortable depth.;Explode upward off the floor.;Land softly and flow into the next rep.|Soft knees on landing.
latb|Lateral Bound|plyo|M|None|Stand on one leg with a slight knee bend.;Push off sideways and land on the opposite foot.;Stick it for one beat, then bound back.|Control the landing before the next bound.
burp|Burpee|plyo|M|None|Drop hands to the floor and kick your feet back to a plank.;Lower your chest to the floor, then press up.;Jump your feet in and leap with hands overhead.|Keep a steady pace.
pplu|Plyometric Push-Up|plyo|M|None|Start in a strong plank with hands under shoulders.;Lower your chest, then explode up so your hands leave the floor.;Land with soft elbows and go again.|Regress to hands on a box if form breaks.
bss|Bulgarian Split Squat|unilateral|M|Bench, dumbbells optional|Rear foot on a bench, front foot about two feet ahead.;Lower your back knee toward the floor.;Drive through the front heel to stand.|Torso stays tall.
slrdl|Single-Leg Romanian Deadlift|unilateral|M|Dumbbell optional|Stand on one leg, soft knee.;Hinge and reach the other leg back as the weight lowers.;Squeeze the glute to stand tall.|Hips stay square to the floor.
stup|Step-Up|unilateral|M|Box or bench|Place one foot fully on a knee-height box.;Drive through that heel to stand tall.;Lower slowly and repeat on the same leg.|Do not push off the back foot.
rlng|Reverse Lunge|unilateral|M|Dumbbells optional|Stand tall and step one foot back.;Lower until both knees reach about 90 degrees.;Push through the front heel to return.|Front knee stays over the foot.
sarow|Single-Arm Dumbbell Row|unilateral|M|Dumbbell, bench|Place one hand and knee on a bench, flat back.;Row the dumbbell toward your hip.;Lower fully and repeat before switching.|Do not twist your torso.
suit|Suitcase Carry|unilateral|M|Dumbbell or kettlebell|Hold a heavy weight in one hand at your side.;Stand tall without leaning.;Walk 30–40 m, then switch hands.|Resist the lean.
pu|Push-Up|bodyweight|M|None|Hands slightly wider than shoulders, body in a straight line.;Lower your chest to just above the floor.;Press back to full arm extension.|Squeeze glutes and brace.
pull|Pull-Up|bodyweight|M|Pull-up bar|Hang with an overhand grip, shoulders engaged.;Pull your chest toward the bar.;Lower to a full hang.|Start every rep from a controlled hang.
plank|Front Plank|bodyweight|M|None|Forearms down, elbows under shoulders.;Body in one straight line from head to heels.;Hold, breathing steadily.|Do not let hips sag.
dbug|Dead Bug|bodyweight|M|None|Lie on your back, arms up, knees bent over hips.;Lower the opposite arm and leg slowly toward the floor.;Return and switch sides, keeping your low back flat.|Press your low back into the floor.
bpa|Band Pull-Apart|band|M|Resistance band|Hold a band at chest height with straight arms.;Pull it apart until it touches your chest.;Return slowly.|Squeeze shoulder blades together.
bfp|Band Face Pull|band|M|Resistance band|Anchor a band at head height and hold both ends.;Pull toward your face, elbows high and wide.;Rotate your hands outward at the end.|Pause for one count at the end.
bhs|Band Hamstring Stretch|band|C|Resistance band|Lie on your back with a band around one foot.;Straighten that leg up and gently pull it toward you.;Hold, keeping the other leg flat.|Stretch, do not strain.
bhf|Band Hip Flexor Stretch|band|C|Resistance band|Half-kneel with a band around the front of the back thigh, anchored behind you.;Tuck your pelvis and shift your hips forward.;Hold, then switch sides.|Squeeze the glute of the back leg.
blat|Band Lat Stretch|band|C|Resistance band, rack|Loop a band on a rack at hip height and grab it with one hand.;Sit hips back and let your arm reach long.;Rotate your chest slightly open and hold.|Breathe into the side of your ribs.
bglu|Band Figure-4 Glute Stretch|band|C|Resistance band|Lie on your back, ankle crossed over the opposite knee.;Loop a band around the lower thigh and pull gently toward your chest.;Hold, then switch sides.|Keep your head and shoulders relaxed.
chpo|Child's Pose|cooldown|C|None|Kneel and sit your hips back toward your heels.;Reach your arms forward along the floor.;Rest your forehead down and breathe deeply.|Slow nasal breathing.
pig|Pigeon Stretch|cooldown|C|None|From hands and knees, bring one knee forward behind that wrist.;Slide the back leg straight behind you.;Fold forward over the front leg and hold.|Support your hip with a towel if needed.
quad|Standing Quad Stretch|cooldown|C|Wall optional|Stand on one leg and pull the opposite heel toward your glute.;Keep your knees together and pelvis tucked.;Hold, then switch.|Do not arch the low back.
chest|Doorway Chest Stretch|cooldown|C|Doorway|Place your forearm on a door frame at shoulder height.;Step through gently until you feel a chest stretch.;Hold, then switch.|Shoulders stay down.
ewalk|Easy Walk and Breathing|cooldown|C|None|Walk at an easy pace.;Breathe in for 4 counts and out for 6.;Gradually bring your heart rate down.|Let your breathing slow your pace.
z2|Zone 2 Steady Run, Bike or Row|conditioning|M|None or cardio machine|Pick a steady-state activity.;Hold a pace where you can still talk in full sentences.;Keep it smooth for the full time.|If you cannot talk, slow down.
ruck|Ruck March|conditioning|M|Rucksack|Pack a load you can carry with good posture.;March at a brisk, steady pace.;Keep a short stride on any incline.|Add weight slowly over weeks.
spr|Sprint Intervals 30:60|conditioning|M|Track, field or machine|Sprint hard for 30 seconds.;Recover by walking for 60 seconds.;Repeat for the planned rounds.|Rest is part of the work.
hill|Hill Repeats|conditioning|M|Hill|Find a steady hill about 30–60 seconds long.;Run up hard, then walk back down.;Repeat for the planned rounds.|Drive your knees and arms.
row|Row Intervals|conditioning|M|Rowing machine|Row hard for the planned time.;Rest with easy rowing or full rest.;Repeat for the planned rounds.|Legs first, then back, then arms.
shut|Shuttle Repeats|conditioning|M|Cones, 50 m lane|Sprint 50 m, touch the line, and return.;Complete 6 lengths per round.;Rest 90 seconds between rounds.|Drop your hips on each turn.
abike|Assault Bike Intervals|conditioning|M|Assault bike|Pedal and push-pull the arms at maximum effort for the interval.;Recover at an easy pace.;Repeat for the planned rounds.|Stay tall and breathe.
pend|Pendulum Swings|pt|M|None|Lean on a table with your good arm and let the other arm hang.;Gently swing it forward and back, then side to side.;Make small circles, relaxed.|Let gravity move the arm.
wsl|Wall Slides|pt|M|Wall|Stand with forearms on a wall.;Slide your arms up as far as comfortable.;Return slowly.|Stay within a pain-free range.
iir|Band Internal Rotation|pt|M|Light band|Stand side-on to the anchor, elbow at your side on a rolled towel, band in the hand nearest the anchor.;Pull your forearm in across your belly.;Return slowly.|Keep the elbow tucked. Stop if the shoulder pinches.
slier|Side-Lying External Rotation|pt|M|Light dumbbell, or none to start|Lie on your good side, top elbow bent 90° and resting on a towel at your side.;Rotate the forearm up toward the ceiling.;Lower slowly over 3 counts.|Keep the elbow on your side. Start with no weight.
caner|Cane External Rotation Stretch|pt|M|Stick or broom handle|Lie on your back, elbows bent 90° at your sides, holding a stick in both hands.;Use the good arm to push the stick so the sore forearm turns outward.;Hold 30 seconds at a gentle stretch.|You should feel a stretch, not pain.
er90|Band External Rotation at 90°|pt|M|Light band|Upper arm out to the side at shoulder height, elbow bent 90°, forearm pointing forward.;Rotate the forearm up until it points at the ceiling.;Return slowly.|Return-to-training phase only. Keep the shoulder down, away from your ear.
dnf|Chin Tuck Head Lift|pt|M|Mat|Lie on your back, knees bent.;Tuck your chin gently, as if nodding yes.;Lift your head about an inch and hold 10 seconds.;Lower and rest.|Stop if you feel dizzy or pain down the arm.
wext|Wrist Extension Curl|pt|M|Light dumbbell|Rest your forearm on a table, hand over the edge, palm down.;Lift the back of your hand up.;Lower slowly over 3 counts.|A mild ache is fine. Sharp pain means a lighter weight.
wflc|Wrist Flexion Curl|pt|M|Light dumbbell|Rest your forearm on a table, hand over the edge, palm up.;Curl the weight up.;Lower slowly over 3 counts.|Move only at the wrist.
rudv|Radial and Ulnar Deviation|pt|M|Hammer or dumbbell held at one end|Rest your forearm on your thigh, thumb up, holding the handle.;Tip the weight up toward the ceiling, then lower.;Turn around, weight pointing down, and lift toward your little finger.|Short, slow arcs. Choke up on the handle to make it easier.
fext|Finger Extension with Rubber Band|pt|M|Rubber band|Loop a rubber band around your fingers and thumb.;Spread your fingers open against the band.;Close slowly.|Do 10 to 15 easy reps.
itbs|Standing IT Band Stretch|pt|M|Wall|Stand side-on to a wall, hand on it.;Cross the leg nearest the wall behind the other.;Lean your hips toward the wall until you feel a stretch on the outer hip.|Hold 30 seconds. Don’t bounce.
sladd|Side-Lying Hip Adduction|pt|M|Mat|Lie on your side, top leg bent with the foot in front of the bottom knee.;Lift the straight bottom leg a few inches.;Lower slowly.|Keep the toes pointing forward.
phe|Prone Hip Extension|pt|M|Mat|Lie face down, forehead on your hands.;Tighten your glute and lift one straight leg a few inches.;Lower slowly.|Don’t arch your low back.
rclam|Reverse Clamshell|pt|M|Mat|Lie on your side, hips and knees bent, knees together.;Keep the knees together and lift the top foot.;Lower slowly.|Turn at the hip, not the back.
wcs|Wall Calf Stretch|pt|M|Wall|Hands on a wall, sore leg straight behind, heel down.;Bend the front knee and lean in until you feel the calf stretch.;Hold 30 seconds.|Keep the back heel on the floor.
wcsb|Bent-Knee Wall Calf Stretch|pt|M|Wall|Same stance as the wall calf stretch.;Bend the back knee, heel still down.;Lean in and hold 30 seconds.|You will feel it lower in the calf.
gball|Golf Ball Roll|pt|M|Golf or massage ball|Sit with your foot on the ball.;Roll from heel to toes with gentle pressure.;Keep going 1 to 2 minutes.|Firm pressure, not painful.
marb|Marble Pickup|pt|M|20 marbles and a cup|Sit with the marbles on the floor.;Pick each one up with your toes.;Drop it in the cup and do all 20.|Slow and controlled.
bdpf|Band Ankle Pumps|pt|M|Light band|Sit with your leg straight, band around the ball of the foot, ends in your hands.;Point the toes down against the band.;Return slowly, then pull the toes up toward you.|Move only at the ankle.
sbrch|Single-Leg Balance Reach|pt|M|Open floor|Stand on the sore leg, knee soft.;Reach the other foot forward, to the side and behind, tapping lightly.;Return to the middle each time.|Hold a wall at first.
slhop|Single-Leg Hop and Stick|pt|M|Open floor|Stand on the sore leg.;Hop forward a short distance.;Land softly, knee over toes, and hold 2 seconds.|Return-to-training phase only. Stop if it hurts or the ankle feels unstable.
ier|Band External Rotation|pt|M|Light band|Elbow at your side with a rolled towel under it.;Rotate your forearm outward against the band.;Return slowly.|Keep your elbow tucked.
scap|Scapular Retraction|pt|M|None|Sit or stand tall with arms at your sides.;Pull shoulder blades back and down.;Hold briefly, then release.|Do not shrug.
pty|Prone Y Raise|pt|M|None|Lie face down with arms in a Y.;Lift your arms slightly, thumbs up.;Lower slowly.|Small, controlled range.
ptilt|Pelvic Tilt|pt|M|None|Lie on your back, knees bent.;Flatten your low back to the floor by tightening your abs.;Release slowly.|Breathe normally.
kts|Knee-to-Chest|pt|M|None|Lie on your back and pull one knee toward your chest.;Hold gently.;Switch legs.|Stay relaxed.
bird|Bird Dog|pt|M|None|Start on hands and knees with a neutral spine.;Reach the opposite arm and leg out.;Return and switch sides.|Do not rotate your hips.
splank|Side Plank (Knees)|pt|M|None|Lie on your side with knees bent, elbow under shoulder.;Lift hips until body is straight from knees to head.;Hold, then switch sides.|Stack your hips.
clam|Clamshell|pt|M|Light band optional|Lie on your side, knees bent, feet together.;Open the top knee without rolling your pelvis.;Lower slowly.|Pelvis stays still.
slr2|Side-Lying Leg Raise|pt|M|None|Lie on your side with legs straight.;Lift the top leg about 30 degrees.;Lower slowly.|Toes point forward.
h9090|90/90 Hip Rotations|pt|M|None|Sit with both knees bent at 90 degrees, legs to one side.;Rotate your knees over to the other side.;Move slowly, staying upright.|Stay tall through the spine.
qset|Quad Set|pt|M|Towel|Sit with your leg straight and a towel under the knee.;Press the back of the knee into the towel by tightening your thigh.;Hold 5 seconds, then relax.|Feel the thigh muscle tighten.
slr|Straight Leg Raise|pt|M|None|Lie on your back with one knee bent and one leg straight.;Tighten your thigh and lift the straight leg to knee height.;Lower slowly.|Lock the knee before you lift.
hslide|Heel Slides|pt|M|None|Lie on your back with legs straight.;Slide your heel toward your glute, bending the knee.;Slide back out slowly.|Go only as far as comfortable.
tke|Terminal Knee Extension|pt|M|Resistance band|Anchor a band behind your knee.;Start with the knee slightly bent, then straighten against the band.;Squeeze your thigh and return slowly.|Lock the knee gently.
chsq|Chair Squat|pt|M|Chair|Stand in front of a chair, feet shoulder-width.;Sit back and lower until you lightly touch the seat.;Stand without using your hands.|Knees track over toes.
sbal|Single-Leg Balance|pt|M|Wall nearby|Stand on one leg near a wall for safety.;Hold your balance with a slight knee bend.;Progress by closing your eyes only when safe.|Fix your eyes on one point.
stdn|Step-Down|pt|M|Low step|Stand on a step on one leg.;Lower the other heel slowly toward the floor.;Tap lightly, then return.|Keep your knee over the second toe.
aabc|Ankle Alphabet|pt|M|None|Sit with your foot off the ground.;Draw each letter of the alphabet with your toes.;Keep the leg still.|Use small, smooth movements.
calf|Calf Raise|pt|M|Step or wall|Stand with feet hip-width, holding a wall.;Rise onto your toes.;Lower slowly.|Pause at the top.
bev|Band Ankle Eversion and Inversion|pt|M|Resistance band|Sit with a band looped around your foot.;Turn the sole outward, then inward, against the band.;Move slowly in both directions.|Keep your shin still.

function ptInj(p){return [p].concat(Array.isArray(p.more)?p.more:[]).filter(j=>j&&PTB[j.area])}
function ptQ(j){return +j?(S.pt.p.more||[])[+j-1]:S.pt.p}
function ptSig(p){return ptInj(p).map(j=>j.area+(+j.phase)).join('|')}
function aLab(a){return String(a||'').split(',').filter(k=>AREAS[k]).map(k=>AREAS[k].toLowerCase()).join(' + ')}
function injLab(j){return (j.side==='Not applicable'?'':j.side+' ')+AREAS[j.area].toLowerCase()}
function ptTitle(p){const inj=ptInj(p),same=inj.every(j=>+j.phase===+inj[0].phase);return inj.map(injLab).join(' + ')+' · '+(same?PHASES[+inj[0].phase]:'Mixed phases')}
function genPT(p,focus){
  const inj=ptInj(p),multi=inj.length>1,minPh=Math.min(...inj.map(j=>+j.phase));
  if(focus==='cardio')return [{id:'lic',rx:['15 min','20 min','25–30 min'][minPh]}];
  if(focus!=='mobility'&&focus!=='strength'&&focus!=='stability')return [{id:'prest',rx:'All day'}];
  const out=[],at={};
  inj.forEach(j=>{
    const b=PTB[j.area],ph=+j.phase;
    const rx={mob:['2×10 slow, pain ≤3/10','2×10 slow','2×12 smooth'][ph],str:['2×10 light','3×12','3×8–10, add load'][ph],stab:['2×20 s','3×30 s','3×45 s'][ph]};
    let rows;
    if(focus==='mobility')rows=[...(ph>0?(PTR[j.area]||[]).map(id=>[id,ph===1?'1×45 s each side, light pressure':'1×60 s each side']):[]),...b.mob.map(id=>[id,rx.mob])];
    else if(focus==='strength'){let n=[2,3,b.str.length][ph];if(multi)n=Math.min(n,inj.length>2?3:4);rows=[[b.mob[0],rx.mob],...b.str.slice(0,n).map(id=>[id,rx.str])]}
    else rows=[[b.mob[0],rx.mob],...b.stab.map(id=>[id,rx.stab])];
    /* hops and 90° rotation only in the return-to-training phase */
    rows=rows.filter(([id])=>!PT_RET[id]||ph===2);
    rows.forEach(([id,r])=>{
      const it=at[id];
      if(!it){const n={id,rx:r};at[id]={n,ph,ar:[j.area]};out.push(n)}
      else{if(!it.ar.includes(j.area))it.ar.push(j.area);if(ph<it.ph){it.ph=ph;it.n.rx=r}}
    });
  });
  if(multi)out.forEach(n=>{n.a=at[n.id].ar.join(',')});
  return out;
}

/* ---------- Body finder: tap where it hurts (up to three), get the exercises ---------- */
let bodyS=[],bodyT=0,bodyMsg='';
function figOpts(){const f=figSex();return `<div class="seg" role="group" aria-label="Soldier"><button aria-pressed="${f==='m'}" data-a="bsex" data-v="m">Male</button><button aria-pressed="${f==='f'}" data-a="bsex" data-v="f">Female</button></div>`}
function figSet(k,v){S.fig=Object.assign({sex:'m'},S.fig||{},{[k]:v});save();const o=document.getElementById('bopts');if(o)o.innerHTML=figOpts();B3.look()}
const BCENTER={neck:1,uback:1,back:1},BBACK={uback:1,back:1};
const BGROUPS=[['mob','Mobility'],['str','Strength'],['stab','Stability']];
const RM=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function sideTxt(x){if(BCENTER[x.a]||!x.s.length)return '';return x.s.length===2?'both':x.s[0]==='L'?'Left':'Right'}
function selLab(x){const t=sideTxt(x);return t==='both'?AREAS[x.a]+', both sides':t?t+' '+AREAS[x.a].toLowerCase():AREAS[x.a]}
const FLIPIC='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10a6.5 6.5 0 0 1 11.6-4"/><path d="M15.6 2.6v3.6H12"/><path d="M16.5 10a6.5 6.5 0 0 1-11.6 4"/><path d="M4.4 17.4v-3.6H8"/></svg>';
function bodyHtml(){
  return `<section class="grp bodyx" id="bodyx" aria-labelledby="bodyxH">
  <div class="bodyx-h"><h3 id="bodyxH">Find exercises by body part</h3><p class="tag">Tap each spot that hurts, up to three. Tap a spot again to clear it. Tap Turn or swipe sideways for the back.</p></div>
  <div class="bstage photo" id="bstage">${B3.stageHtml()}</div>
  <div class="bopts" id="bopts">${figOpts()}</div>
  <div class="bstat" id="bstat" aria-live="polite">${bodyStat()}</div>
  <div class="chips cats" id="bchips" role="group" aria-label="Body part">${bodyChips()}</div>
  <div id="bres">${bodyRes()}</div></section>`}
function bodyChips(){return Object.entries(AREAS).map(([k,v])=>`<button class="chip" aria-pressed="${bodyS.some(x=>x.a===k)}" data-a="barea" data-v="${k}">${v}</button>`).join('')}
function bodyStat(){
  if(bodyMsg)return `<p class="bmsg">${bodyMsg}</p>`;
  if(!bodyS.length)return '<p class="bnone">No spots marked yet.</p>';
  return `<p class="bcount"><b>${bodyS.length} of 3</b> marked<span class="vh">: ${esc(bodyS.map(selLab).join(', '))}</span></p><button class="btn ghost small" data-a="bclear">Clear all</button>`}
function bodyRes(){
  if(!bodyS.length)return '<p class="bhint">Mark a spot on the figure, or pick a body part above, to see its rehab exercises.</p>';
  if(bodyT>=bodyS.length)bodyT=bodyS.length-1;
  const x=bodyS[bodyT],a=x.a,g=PTB[a],n1=bodyS.length;
  const rows=ids=>ids.filter(id=>EX[id]).map(id=>`<div class="item"><button class="nm" data-a="info" data-v="${id}">${esc(EX[id].name)}<small>${esc(EX[id].eq)}</small></button></div>`).join('');
  const sets=BGROUPS.map(([k,n])=>[n,g[k]||[]]).concat([['Foam rolling',PTR[a]||[]]]).filter(s=>s[1].length);
  const n=new Set(sets.flatMap(s=>s[1])).size;
  const tabs=n1>1?`<div class="btabs" role="tablist" aria-label="Marked injuries">${bodyS.map((y,i)=>`<button role="tab" aria-selected="${i===bodyT}" data-a="btab" data-v="${i}"><span class="bnum" aria-hidden="true">${i+1}</span>${esc(selLab(y))}</button>`).join('')}</div>`:'';
  return `${tabs}<div class="bres-in" role="${n1>1?'tabpanel':'region'}" aria-label="${esc(selLab(x))} exercises"><div class="bres-h"><div><h3>${esc(selLab(x))}</h3><p class="tag">${n} exercises. Tap one for steps and photos.</p></div><button class="btn" data-a="buse">${n1>1?`Build one plan for all ${n1}`:'Build a plan for this'}</button></div>
  ${sets.map(([n,ids])=>`<div class="bset"><h4>${n}</h4><div class="list">${rows(ids)}</div></div>`).join('')}
  ${a==='wrist'?'':'<p class="tag">Foam roll the muscles around the injury, never the injured joint itself.</p>'}</div>`}
function bodyRefresh(keepTab){
  const c=document.getElementById('bchips');if(c){const x=c.scrollLeft;c.innerHTML=bodyChips();c.scrollLeft=x}
  const st=document.getElementById('bstat');if(st)st.innerHTML=bodyStat();
  const b=document.getElementById('bres');if(b){b.innerHTML=bodyRes();if(keepTab)b.querySelector('.bres-in')?.classList.add('still')}
  B3.sync()}
function bodyFull(){bodyMsg='The PT plan takes up to three injuries. Tap a marked spot to clear it first.';bodyRefresh(true);B3.nudge();clearTimeout(bodyFull.t);bodyFull.t=setTimeout(()=>{bodyMsg='';const st=document.getElementById('bstat');if(st)st.innerHTML=bodyStat()},3200)}
function bodyHaptic(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
/* From the figure: a tap marks or clears one side of one area */
function bodyPick(a,sd){
  const side=BCENTER[a]?'':sd;let i=bodyS.findIndex(x=>x.a===a);bodyMsg='';
  if(i>=0){const x=bodyS[i];
    if(!side||x.s.includes(side)){x.s=x.s.filter(s=>s!==side);if(!side||!x.s.length){bodyS.splice(i,1);if(bodyT>=i&&bodyT>0)bodyT--}}
    else{x.s.push(side);bodyT=i}}
  else{if(bodyS.length>=3)return bodyFull();bodyS.push({a,s:side?[side]:[]});bodyT=bodyS.length-1}
  bodyHaptic();bodyRefresh()}
/* From the chips: toggles a whole area */
function bodySel(a){
  const i=bodyS.findIndex(x=>x.a===a);bodyMsg='';
  if(i>=0){bodyS.splice(i,1);if(bodyT>=i&&bodyT>0)bodyT--}
  else{if(bodyS.length>=3)return bodyFull();bodyS.push({a,s:[]});bodyT=bodyS.length-1;B3.face(a)}
  bodyHaptic();bodyRefresh()}
function bodyUse(){
  if(!bodyS.length)return;
  const prev=ptInj(S.pt.p),p=S.pt.p;
  const list=bodyS.map(x=>{const old=prev.find(j=>j.area===x.a),t=sideTxt(x);
    return {area:x.a,side:BCENTER[x.a]?'Not applicable':t==='both'?'Both':t||(old?old.side:p.side||'Right'),phase:old?old.phase:p.phase,pain:old?old.pain:p.pain}});
  Object.assign(p,list[0]);p.more=list.slice(1);save();render();
  const h=document.getElementById('ptPlanH');if(h){h.scrollIntoView({behavior:RM()?'auto':'smooth',block:'start'});document.querySelectorAll('#view .form label').forEach((l,i)=>{if(/Injury area/.test(l.textContent))l.classList.add('flash')})}}

/* ---------- The body map: front and back photos with tappable joints ---------- */
/* Spot positions on the 720×960 photo frames. Paired values are viewer-left x, viewer-right x, y. */
const BPTS={
 'm-front':{neck:[360,162],shoulder:[247,473,228],elbow:[160,560,322],wrist:[110,610,400],hip:[300,422,470],knee:[300,422,632],ankle:[287,433,835]},
 'f-front':{neck:[360,162],shoulder:[247,473,228],elbow:[160,560,322],wrist:[110,610,400],hip:[300,422,470],knee:[302,420,648],ankle:[287,433,835]},
 'm-back':{neck:[360,148],uback:[360,250],back:[360,375],shoulder:[248,472,232],elbow:[152,566,330],wrist:[104,612,402],hip:[298,422,472],knee:[300,420,632],ankle:[292,428,835]},
 'f-back':{neck:[360,148],uback:[360,250],back:[360,375],shoulder:[248,472,232],elbow:[152,566,330],wrist:[104,612,402],hip:[298,422,472],knee:[302,420,650],ankle:[292,428,835]}};
/* On the front view the Soldier's right side is on the viewer's left; on the back view it is on the viewer's right. */
function bRegions(key){const back=key.endsWith('back'),o=[];
  for(const [a,v] of Object.entries(BPTS[key])){if(v.length===2)o.push({a,s:'',x:v[0],y:v[1]});else{o.push({a,s:back?'L':'R',x:v[0],y:v[2]});o.push({a,s:back?'R':'L',x:v[1],y:v[2]})}}
  return o.sort((p,q)=>p.y-q.y||p.x-q.x)}
function figSex(){return (S.fig&&S.fig.sex)==='f'?'f':'m'}
const B3={view:'front',prev:null,busy:false,
 key(){return figSex()+'-'+this.view},
 src(v){return `ph/body-${figSex()}-${v||this.view}.webp?v=4`},
 stageHtml(){return `<span class="bview" id="bview" aria-hidden="true">${this.view==='back'?'Back':'Front'}</span>
  <div class="bfig" id="bfig"><img id="bimg" src="${this.src()}" alt="" width="720" height="960" draggable="false"><div class="bspots" id="bspots">${this.spotsHtml()}</div></div>
  <button class="btn ghost bflip" data-a="bflip" aria-label="Turn the Soldier around to see the ${this.view==='back'?'front':'back'}">${FLIPIC}Turn</button>`},
 marked(){const m=new Set();for(const x of bodyS){if(BCENTER[x.a])m.add(x.a+':');else if(!x.s.length){m.add(x.a+':L');m.add(x.a+':R')}else x.s.forEach(s=>m.add(x.a+':'+s))}return m},
 spotsHtml(){const m=this.marked(),fresh=this.fresh||new Set();
  return bRegions(this.key()).map(r=>{const k=r.a+':'+r.s,on=m.has(k),i=bodyS.findIndex(x=>x.a===r.a);
   const lab=BCENTER[r.a]?AREAS[r.a]:(r.s==='L'?'Left ':'Right ')+AREAS[r.a].toLowerCase();
   return `<button class="bspot${on?' on':''}${on&&fresh.has(k)?' pop':''}" style="left:${(r.x/7.2).toFixed(2)}%;top:${(r.y/9.6).toFixed(2)}%" data-a="bspot" data-v="${r.a}" data-s="${r.s}" aria-pressed="${on}" aria-label="${lab}${on?', marked '+(i+1):''}">${on?`<span class="bn" aria-hidden="true">${i+1}</span>`:''}</button>`}).join('')},
 mount(host){
  for(const s of ['m','f'])for(const v of ['front','back']){const im=new Image();im.src=`ph/body-${s}-${v}.webp?v=4`}
  this.prev=this.marked();
  const f=document.getElementById('bfig');if(!f)return;
  /* Swipe sideways to turn; tap anywhere near a joint to mark it */
  let d=null;
  f.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')e.preventDefault();d={x:e.clientX,y:e.clientY,t:Date.now()}});
  f.addEventListener('pointerup',e=>{if(!d)return;const dx=e.clientX-d.x,dy=e.clientY-d.y;const sw=Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3;d=null;
   if(sw){this.swiped=Date.now();this.flip();return}
   if(e.target.closest('.bspot'))return;
   const b=f.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*720,y=(e.clientY-b.top)/b.height*960;
   let best=null,bd=1e9;for(const r of bRegions(this.key())){const q=Math.hypot(r.x-x,r.y-y);if(q<bd){bd=q;best=r}}
   if(best&&bd<78){bodyPick(best.a,best.s);return}
   if(this.view==='front'&&x>250&&x<470&&y>165&&y<450){bodyMsg='Upper and low back injuries go on the back. Turned around for you.';this.flip();bodyRefresh(true);clearTimeout(this.mt);this.mt=setTimeout(()=>{bodyMsg='';const st=document.getElementById('bstat');if(st)st.innerHTML=bodyStat()},3600)}});
  f.addEventListener('click',e=>{if(this.swiped&&Date.now()-this.swiped<400){e.stopPropagation();e.preventDefault()}},true)},
 sync(){const now=this.marked();this.fresh=new Set([...now].filter(k=>!this.prev||!this.prev.has(k)));this.prev=now;
  const el=document.getElementById('bspots');if(el)el.innerHTML=this.spotsHtml();this.fresh=null},
 setView(v){this.view=v;const bv=document.getElementById('bview');if(bv)bv.textContent=v==='back'?'Back':'Front';
  const fb=document.querySelector('.bflip');if(fb)fb.setAttribute('aria-label',`Turn the Soldier around to see the ${v==='back'?'front':'back'}`);
  const el=document.getElementById('bspots');if(el)el.innerHTML=this.spotsHtml()},
 /* Turning: the photo narrows to its edge, swaps, and widens again, like a figure on a turntable */
 flip(){if(this.busy)return;const to=this.view==='back'?'front':'back',img=document.getElementById('bimg'),sp=document.getElementById('bspots');
  if(!img||RM()){if(img)img.src=this.src(to);this.setView(to);return}
  this.busy=true;img.classList.remove('t-in','swap');sp&&sp.classList.add('t-hide');img.classList.add('t-out');
  setTimeout(()=>{img.src=this.src(to);this.setView(to);img.classList.remove('t-out');void img.offsetWidth;img.classList.add('t-in');sp&&sp.classList.remove('t-hide');setTimeout(()=>{this.busy=false},260)},150)},
 face(a){if(BBACK[a]&&this.view==='front')this.flip()},
 look(){const img=document.getElementById('bimg');if(!img)return;img.src=this.src();if(!RM()){img.classList.remove('swap','t-in');void img.offsetWidth;img.classList.add('swap')}
  const el=document.getElementById('bspots');if(el)el.innerHTML=this.spotsHtml()},
 nudge(){const s=document.getElementById('bstat');if(s&&!RM()){s.classList.remove('nudge');void s.offsetWidth;s.classList.add('nudge')}},
 theme(){},go(){}
};
function chipSync(id,sel,act){const el=document.getElementById(id);if(!el)return;const x=el.scrollLeft;el.innerHTML=chipsHtml(sel,act);el.scrollLeft=x;const on=el.querySelector('[aria-pressed="true"]');if(on){const L=on.offsetLeft-el.offsetLeft,W=el.clientWidth;const t=Math.max(0,L-(W-on.offsetWidth)/2);el.scrollTo({left:t,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
function chipsHtml(sel,act){return `<button class="chip" aria-pressed="${sel===''}" data-a="${act}" data-v="">All</button>`+Object.entries(CATS).map(([k,n])=>`<button class="chip" aria-pressed="${sel===k}" data-a="${act}" data-v="${k}">${n}</button>`).join('')}

  };

  const mg=EX[id]?musclesOf(id):[];
  const note=stock?`<p class="tag" style="margin:-4px 0 4px">${mg.length?'Works: '+mg.map(x=>MZN[x]).join(', ')+'. ':''}${PHV[id]?'':'Photos from Free Exercise DB. '}Follow the written steps if they differ.</p>`:(mg.length?`<p class="tag" style="margin:-4px 0 4px">Works: ${mg.map(x=>MZN[x]).join(', ')}.${YT[id]?' Watch the video, then follow the written steps.':''} You can add your own start and finish photos too.</p>`:'');
  const bad=(typeof phState!=='undefined'&&phState==='no')?'<p class="tag" style="margin:0 0 6px">Photos cannot be saved in this browser.</p>':'<p class="tag" style="margin:0 0 6px">Your photos are saved on this phone only.</p>';
  const vid=!BPH[id]&&YT[id]?`<a class="ytcard" href="https://www.youtube.com/watch?v=${YT[id]}" target="_blank" rel="noopener" aria-label="Watch a demo of ${esc(EX[id]?EX[id].name:id)} on YouTube"><img src="https://i.ytimg.com/vi/${YT[id]}/mqdefault.jpg" alt="" loading="lazy" width="320" height="180" onerror="this.remove()"><span class="ytplay" aria-hidden="true"></span><span class="ytlab">Watch demo on YouTube</span></a>`:'';
  return `${vid}<div class="ill">${figs.join('')}</div><div class="note warn" id="phErr" hidden></div>${note}${addMid}${bad}`;
}

function rbProgress(id){const r=RB_BY[id],c=rbCount(id);let times,count;
  if('times' in c){times=c.times;count=Math.min(c.cur,r.target)}
  else{times=r.rep?Math.floor(c.n/r.target):(c.n>=r.target?1:0);count=r.rep?c.n%r.target:Math.min(c.n,r.target)}
  const aw=S.rb.aw[id];return {count,target:r.target,times:Math.max(times,aw?aw.n:0)}}

function rbWatchPT(){const T=S.rb.tally,inj=[S.pt.p,...(S.pt.p.more||[])].filter(j=>j&&AREAS[j.area]);
  inj.forEach(j=>{const was=T.ph[j.area];if(was!==undefined&&j.phase>was)T.phc=(T.phc||0)+1;T.ph[j.area]=j.phase});
  const hasPlan=!!T.ptb,pain=Math.min(...inj.map(j=>+j.pain||0));
  if(hasPlan){if(T.pmax>=2&&pain<=1){T.pdn=(T.pdn||0)+1;T.pmax=0}T.pmax=Math.max(T.pmax,...inj.map(j=>+j.pain||0))}}

  for(let pass=0;pass<2;pass++)RB.forEach(r=>{if(!r.rep&&R.aw[r.id])return;const p=rbProgress(r.id),prev=R.aw[r.id]?R.aw[r.id].n:0,n=Math.min(99,r.rep?p.times:Math.min(1,p.times));
    if(n>prev){R.aw[r.id]={d:tk,n};const o=out.find(x=>x.id===r.id);if(o)o.n=n;else out.push({id:r.id,n,prev});if(!R.q.includes(r.id))R.q.push(r.id);R.seen=R.seen.filter(x=>x!==r.id)}});
  return out}
