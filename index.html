    <h3>Events in order</h3>
    <ol class="steps">
      <li><b>3-Rep Max Deadlift (MDL).</b> Three continuous reps at the same weight on the hex bar, under control. The bar is placed on the ground, never dropped. Two attempts at most.</li>
      <li><b>Hand-Release Push-Up (HRP).</b> As many as possible in 2 minutes. Chest, hips and thighs touch down together, the hands release out to a T, then the body pushes up as one unit. The only rest position is the front leaning rest.</li>
      <li><b>Sprint-Drag-Carry (SDC).</b> Five 50 m shuttles on a 25 m lane: sprint, sled drag, lateral, kettlebell carry, sprint. 250 m in total. Hand and foot touch the turn line on the sprint and lateral, and the whole sled crosses the line on the drag. Time stops when the Soldier crosses the start line after the last sprint.</li>
      <li><b>Plank (PLK).</b> Hold a straight line from head to heels for as long as possible. One verbal warning is given. The event ends if anything other than feet, forearms and fists or palms touches the ground, or a hand or foot lifts.</li>
      <li><b>Two-Mile Run (2MR).</b> A measured, generally flat course on a track, road or other improved surface. Out-and-back and lap courses are allowed. Unimproved terrain is not.</li>
    </ol>
    <h3>Equipment for each lane</h3>
    <ul class="tips">
      <li>60 lb hex bar and plates</li>
      <li>90 lb sled with pull strap</li>
      <li>Two 40 lb kettlebells</li>
      <li>A 25 m lane on level ground for the SDC</li>
      <li>A level surface for the HRP and PLK</li>
      <li>A measured two-mile route that starts and finishes near the lanes</li>
    </ul>
    <h3 style="margin-top:14px">Also bring</h3>
    <ul class="tips">
      <li>Collars for the hex bar</li>
      <li>A stopwatch for each grader and a clock for the run</li>
      <li>A measuring tape or wheel, and cones or tape to mark the start and 25 m lines</li>
      <li>Scorecards and pens</li>
      <li>Water, and medical coverage as your unit SOP requires</li>
    </ul>
    <h3 style="margin-top:14px">Running it</h3>
    <ul class="tips">
      <li>Put one grader on each lane. Brief the standards for every event before the first lift.</li>
      <li>Test one Soldier per lane at a time on the HRP and SDC.</li>
      <li>On the SDC the grader watches both the start line and the 25 m line, and may post a Soldier on the 25 m line to help.</li>
      <li>Rest times between events and grader requirements are set in ATP 7-22.01, chapter 2. Check the current copy before test day.</li>
    </ul>

  <details class="cmx" id="fmCft"><summary><b>Combat Field Test (CFT)</b><small>Seven events · pass or fail · combat specialties</small></summary>
    <p style="margin-top:8px">New in 2026 under Army Directive 2026-07 and HQDA EXORD 103-26. Soldiers in 24 designated combat specialties take it as well as the AFT. All seven events run back to back on one clock, and the Soldier passes by finishing in 30 minutes or less. The standard is the same for every age and sex.</p>
    <div class="note"><b>Diagnostic until 16 April 2027.</b> Record tests start on 17 April 2027.</div>
    <h3>Events in order</h3>
    <ol class="steps">
      <li><b>One-mile run.</b></li>
      <li><b>30 dead-stop push-ups.</b></li>
      <li><b>100 m sprint.</b></li>
      <li><b>16 sandbag lifts.</b> A 40 lb sandbag onto a 65-inch platform.</li>
      <li><b>50 m water can carry.</b> Two 5-gallon Army water cans, 40 lb each.</li>
      <li><b>50 m movement drill.</b> High crawl for 25 m, then 3 to 5 second rushes for 25 m.</li>
      <li><b>One-mile run.</b></li>
    </ol>
    <div class="row"><button class="btn" data-a="cftpractice">Practice the CFT with a timer</button></div>
    <h3>Uniform</h3>
    <p>Army Combat Uniform, combat boots and brown T-shirt. No headgear.</p>
    <h3>Equipment the test names</h3>
    <ul class="tips">
      <li>40 lb sandbag</li>
      <li>65-inch platform</li>
      <li>Two 5-gallon Army water cans filled to 40 lb each</li>
    </ul>
    <h3 style="margin-top:14px">Site to lay out</h3>
    <ul class="tips">
      <li>A measured one-mile route that starts and finishes at the stations</li>
      <li>A push-up area on level ground</li>
      <li>A 100 m sprint lane</li>
      <li>A 50 m lane for the water can carry</li>
      <li>A 50 m lane for the movement drill, marked at 25 m</li>
    </ul>
    <h3 style="margin-top:14px">Also bring</h3>
    <ul class="tips">
      <li>A scale to check the sandbag and water can weights</li>
      <li>A measuring tape for the platform height and lane distances</li>
      <li>A stopwatch that keeps one running time for each Soldier</li>
      <li>Cones, scorecards and pens</li>
      <li>Water, and medical coverage as your unit SOP requires</li>
    </ul>
    <h3 style="margin-top:14px">Who takes it</h3>
    <p>11A, 11B, 11C, 11Z, 12A, 12B, 12D, 13A, 13F, 180A, 18A, 18B, 18C, 18D, 18E, 18F, 18Z, 19A, 19C, 19D, 19K, 19Z, 89D and 89E. There are no modified events, and a Soldier on a temporary profile does not take a record CFT.</p>
    <div class="note warn"><b>Get Annex B before you run one.</b> The Army's public pages list the events but not the grading rules for each one. The testing guidance, lane layout and scorecard are in Annex B of EXORD 103-26, which your S3 can pull.</div>

  else if(w.avg>9)t.push('You are averaging '+slFmt(w.avg)+' h, above 9 h. If you still feel tired, consider asking a medical provider.');

/* Sheets: move focus in on open, trap Tab, close on Escape, give focus back on close */
(function(){const opener=new Map();
  const top=()=>[...document.querySelectorAll('.sheet:not([hidden])')].sort((a,b)=>(+getComputedStyle(b).zIndex||0)-(+getComputedStyle(a).zIndex||0))[0];
  const focusables=el=>[...el.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  const mo=new MutationObserver(ms=>ms.forEach(m=>{const sh=m.target;if(!sh.classList||!sh.classList.contains('sheet'))return;const pn=sh.querySelector('.panel');
    if(!sh.hidden){if(!opener.has(sh))opener.set(sh,document.activeElement);if(pn){pn.setAttribute('aria-modal','true');if(!pn.hasAttribute('tabindex'))pn.tabIndex=-1;requestAnimationFrame(()=>{if(!pn.contains(document.activeElement)){const h=pn.querySelector('h2,h3');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}else pn.focus({preventScroll:true})}})}}
    else{const o=opener.get(sh);opener.delete(sh);if(o&&o.isConnected&&!top())try{o.focus({preventScroll:true})}catch(e){}}}));
  document.querySelectorAll('.sheet').forEach(sh=>mo.observe(sh,{attributes:true,attributeFilter:['hidden']}));
  document.addEventListener('keydown',e=>{const sh=top();if(!sh)return;
    if(e.key==='Escape'){const c=[...sh.querySelectorAll('[data-a$="close"],[data-a="closeinfo"],[data-a="cmclose"]')].find(x=>x.offsetParent!==null);if(c)c.click();else sh.hidden=true;e.preventDefault();return}
    if(e.key==='Tab'){const f=focusables(sh);if(!f.length)return;const a=f[0],z=f[f.length-1];
      if(e.shiftKey&&(document.activeElement===a||!sh.contains(document.activeElement))){z.focus();e.preventDefault()}
      else if(!e.shiftKey&&(document.activeElement===z||!sh.contains(document.activeElement))){a.focus();e.preventDefault()}}})})();

const CODE_HASH="1747c2abe1eadcdea4b45504048cc40bbf661d06f5381c439efdcd436b0aad86";
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}

  if(ok){try{localStorage.setItem('h2f.access',CODE_HASH)}catch(e){}document.getElementById('gateCode').value='';err.textContent='';showGate(false);tourMaybe()}
  else{err.textContent='That code is not right. Check it and try again.';document.getElementById('gateCode').select()}

var XS={items:[],src:''};
function cmStr(x,max){return typeof x==='string'?x.trim().slice(0,max):''}
function cmClean(o){

const XS_TAG='H2FEX1:';
function xsEnc(list,from){const j=JSON.stringify({v:1,from:cmStr(from,40),ex:list.map(e=>cmClean(e)).filter(Boolean)});
  const b=new TextEncoder().encode(j);let s='';b.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function xsDec(code){try{const s=atob(code.replace(/-/g,'+').replace(/_/g,'/'));const b=Uint8Array.from(s,c=>c.charCodeAt(0));
  const o=JSON.parse(new TextDecoder().decode(b));if(!o||!Array.isArray(o.ex))return null;
  return {from:cmStr(o.from,40),ex:o.ex.slice(0,40).map(cmClean).filter(Boolean)}}catch(e){return null}}
/* A link only makes sense on the app's own website, where the page can read it back */
function xsSite(){try{return window.top===window&&location.protocol==='https:'?location.origin+location.pathname:''}catch(e){return ''}}
function xsMine(){return (S.custom||[]).map(c=>EX[c.id]).filter(Boolean)}

    rows.forEach(x=>{out+=`<tr style="border-bottom:1px solid #ddd;break-inside:avoid"><td>${esc(jrLabel(x[0]))}</td><td>${slFmt(x[1])}</td><td>${x[2].r||'–'}</td><td>${x[2].c?'Yes':'No'}</td><td>${x[2].s?'Yes':'No'}</td></tr>`});
    out+='</tbody></table>';
    out+='<div class="pr-note">Self-reported sleep log from the H2F Trainer app. Adults generally need 7 to 9 hours. This is not a medical diagnosis.</div>';
  }else if(/^jr-/.test(kind)){
    const k=kind.slice(3),title=k==='mind'?'Mind':'Spiritual',es=jrEntries(k);
    out+=`<h1>H2F ${title} Journal</h1><p class="prsub">${es.length} entr${es.length===1?'y':'ies'}${es.length?' · '+esc(jrLabel(es[0].d))+' to '+esc(jrLabel(es[es.length-1].d)):''}</p>`;
    es.forEach(e=>{out+=`<div class="pr-day" style="break-inside:avoid"><h2 style="font-size:15px">${esc(jrLabel(e.d))}</h2><div style="white-space:pre-wrap">${esc(e.t)}</div></div>`});
    out+='<div class="pr-note">This is a private journal. Keep this printout somewhere safe.</div>';
  }else if(kind==='st'){
    const c=stCfg(),n=c.st.length,boxes='<span class="pr-box" style="display:inline-block;margin-right:6px"></span>'.repeat(8);
    out+=`<h1>H2F Station Workout</h1><p class="prsub">${n} station${n===1?'':'s'} · ${c.mins} min each · ${c.mins*n} min total<br>Rotate to the next station when time is up.</p>`;
    c.st.forEach((arr,s)=>{
      out+=`<div class="pr-day${steps?' brk':''}"><h2>Station ${s+1} · ${c.mins} min</h2>`;
      const rows=arr.filter(id=>EX[id]);
      out+=rows.length?rows.map(id=>prRow({id},steps,'st')).join(''):'<div class="pr-empty">No exercises chosen.</div>';
      out+=`<h3>Rounds completed</h3><div>${boxes}</div></div>`});
    out+='<div class="pr-note">Move through the exercises in order, keep a steady pace, and tick a box for each round you finish. Stop if something hurts.</div>';
  }else if(kind==='train'){
    out+=`<h1>H2F Weekly Workout</h1><p class="prsub">Week of ${esc(rng)}</p>`;
    for(let i=0;i<5;i++){
      out+=`<div class="pr-day${steps?' brk':''}"><h2>${DN[i]} ${esc(fmt(dayDate(i)))} · ${esc(DTYPES[S.types[i]])}</h2>`;
      const arr=S.plan[i]||[];let any=false;
      ['W','M','C'].forEach(s=>{if(s==='M'&&isSt(i)){const c=dayStCfg(i);any=true;out+=`<h3>Stations · ${c.st.length} × ${c.mins} min</h3>`+c.st.map((st,k)=>`<div class="pr-row"><span class="pr-box"></span><span class="pr-nm">Station ${k+1}<small>${st.filter(id=>EX[id]).map(id=>esc(EX[id].name)).join(', ')||'No exercises'}</small></span><span class="pr-rx">${c.mins} min</span></div>`).join('');return}
        const rows=arr.filter(it=>EX[it.id]&&(it.s||EX[it.id].sec)===s);if(!rows.length)return;any=true;out+=`<h3>${SECNAME[s]}</h3>`+rows.map(it=>prRow(it,steps,'train')).join('')});
      if(!any)out+='<div class="pr-empty">No exercises planned.</div>';
      out+='</div>'}
    out+='<div class="pr-note">Warm up before you start, stop if something hurts, and drink water. Tick each box as you finish.</div>';
  }else{
    const p=S.pt.p;
    out+=`<h1>H2F Injury PT Plan</h1><p class="prsub">${p.name?esc(p.name)+(ptInj(p).length>1?'<br>':' · '):''}${ptInj(p).map(j=>esc(injLab(j))+' · '+esc(PHASES[+j.phase])+' · pain '+esc(j.pain)+'/10').join('<br>')}<br>Week of ${esc(rng)}</p>`;
    for(let i=0;i<5;i++){
      out+=`<div class="pr-day${steps?' brk':''}"><h2>${DN[i]} ${esc(fmt(dayDate(i)))} · ${esc(FOCI[S.pt.focus[i]])}</h2>`;
      const rows=(S.pt.plan[i]||[]).filter(it=>EX[it.id]);
      out+=rows.length?rows.map(it=>prRow(it,steps)).join(''):'<div class="pr-empty">No exercises planned.</div>';
      out+='</div>'}
    out+='<div class="pr-note">Stop and see a provider for numbness, night pain, visible swelling, or if you cannot bear weight. This plan supports, and does not replace, care from your PT.</div>';
  }
  return out}
function prShow(){document.getElementById('prDoc').innerHTML=prHtml(prKind,document.getElementById('prSteps').checked)}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='print'){prKind=b.dataset.k==='pt'?'pt':b.dataset.k==='st'?'st':b.dataset.k==='sl'?'sl':b.dataset.k==='nu'?'nu':b.dataset.k==='sq'?'sq':b.dataset.k==='mo'?'mo':/^jr-/.test(b.dataset.k||'')?b.dataset.k:'train';document.getElementById('prSteps').checked=false;document.getElementById('prSteps').parentElement.style.display=/^jr-/.test(prKind)||prKind==='sl'||prKind==='nu'||prKind==='sq'||prKind==='mo'?'none':'';prShow();const s=document.getElementById('prSheet');s.hidden=false;s.scrollTop=0}
  else if(a==='prclose')document.getElementById('prSheet').hidden=true;
  else if(a==='prgo'){sgPrintOff();try{window.print()}catch(e){}}
});
document.addEventListener('change',ev=>{if(ev.target.id==='prSteps')prShow()});


/* autosave: always write to this phone when the app is hidden or closed, and keep a private copy in your account when signed in */
function flushNow(){save();idbPut()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushNow()});
window.addEventListener('pagehide',flushNow);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}

/* user photos: saved on this phone (IndexedDB) */
let PH={},idb=null,phState='init',phArm='';
function idbOpenPhotos(){return new Promise((res,rej)=>{try{const r=indexedDB.open('h2f-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))}catch(e){rej(e)}})}
function refreshInfo(){try{if(!document.getElementById('infoSheet').hidden&&window.__infoId)openInfo(window.__infoId)}catch(e){}}
async function phInit(){
  try{idb=await idbOpenPhotos();
    await new Promise((res,rej)=>{const rq=idb.transaction('p','readonly').objectStore('p').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>rej(rq.error)});
    phState='ok'}catch(e){phState='no'}
  refreshInfo();
}
function phTx(fn){return new Promise((res,rej)=>{if(!idb)return res();const tx=idb.transaction('p','readwrite');fn(tx.objectStore('p'));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
const phPut=(k,v)=>phTx(s=>s.put(v,k));
const phDelete=k=>phTx(s=>s.delete(k));
function toJpeg(file){
  const tiers=[[800,.82],[640,.75],[512,.7],[400,.65]];
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{
      let out='';
      for(const [M,q] of tiers){const sc=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<=190000)break}
      URL.revokeObjectURL(url);res(out)}catch(e){rej(e)}};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('bad image'))};im.src=url})}
async function phSave(k,url){
  if(phState==='ok')await phPut(k,url);
  PH[k]=url;
}
async function phRemove(k){
  try{await phDelete(k)}catch(e){}
  delete PH[k];
}
function phIdsFor(id){return Object.keys(PH).filter(k=>k.startsWith(id+':'))}
async function phDeleteAll(id){for(const k of phIdsFor(id))await phRemove(k)}
document.addEventListener('change',async ev=>{
  const t=ev.target;if(!t.dataset||t.dataset.f!=='photo')return;
  const f=t.files&&t.files[0],id=t.dataset.id,w=t.dataset.w,err=document.getElementById('phErr');
  if(!f)return;
  const fail=m=>{if(err){err.textContent=m;err.hidden=false}};
  if(!/^image\//.test(f.type))return fail('Choose an image file.');
  try{const url=await toJpeg(f);await phSave(id+':'+w,url);phArm='';openInfo(id)}
  catch(e){fail('Could not save that photo. Try a smaller picture.')}
});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a="phdel"]');if(!b)return;
  const k=b.dataset.v;
  if(phArm!==k){phArm=k;b.textContent='Tap again to remove';return}
  phArm='';await phRemove(k);openInfo(k.split(':')[0]);
});
phInit();

/* bulk photo import: match file names to exercises */
const slug=s=>String(s).toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
function nameIndex(){const m={};Object.values(EX).forEach(e=>{m[slug(e.name)]=e.id;m[slug(e.id)]=e.id});return m}
function matchFile(fn,idx){
  let b=slug(fn),w='a';
  const sfx=b.match(/-(start|begin|beginning|a|1|finish|end|ending|b|2)$/);
  if(sfx){b=b.slice(0,-sfx[0].length);w=/^(finish|end|ending|b|2)$/.test(sfx[1])?'b':'a'}
  const id=idx[b];return id?{id,w}:null;
}
document.addEventListener('change',async ev=>{
  const t=ev.target;if(!t.dataset||t.dataset.f!=='bulk')return;
  const files=[...t.files],out=document.getElementById('bulkRes');
  t.value='';
  if(!files.length)return;
  if(phState==='no'){out.textContent='Photos cannot be saved in this browser.';out.style.display='block';return}
  const idx=nameIndex(),miss=[],bad=[];let ok=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];out.textContent=`Importing ${i+1} of ${files.length}...`;out.style.display='block';
    if(!/^image\//.test(f.type)){bad.push(f.name);continue}
    const m=matchFile(f.name,idx);
    if(!m){miss.push(f.name);continue}
    try{await phSave(m.id+':'+m.w,await toJpeg(f));ok++}catch(e){bad.push(f.name)}
  }
  let msg=`Imported ${ok} photo${ok===1?'':'s'}.`;
  if(miss.length)msg+=` No exercise matched: ${miss.slice(0,8).join(', ')}${miss.length>8?' and '+(miss.length-8)+' more':''}.`;
  if(bad.length)msg+=` Could not read: ${bad.slice(0,5).join(', ')}.`;
  out.textContent=msg;out.style.display='block';
  refreshInfo();
});

showGate(!unlocked());
